# Улица праздников — добавить в инклюд-файл домена belovolovhome.ru.
# FastPanel2: /etc/nginx/fastpanel2-sites/belovolovhom_usr/belovolovhome.ru.includes
# Паттерн 1:1 как у /magicfarm/ (^~ + alias + @spa fallback через root).
# После добавления: nginx -t && systemctl reload nginx

location = /holidays {
    return 301 /holidays/;
}

# Хэшированные ассеты Vite: кэшируем агрессивно.
location ^~ /holidays/assets/ {
    alias /opt/holidays/frontend/dist/assets/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    gzip_static on;
}

location ^~ /holidays/ {
    alias /opt/holidays/frontend/dist/;
    try_files $uri @holidays_spa;
    gzip_static on;
}

# index.html без кэша: после деплоя браузер сразу забирает свежие хэши чанков.
location = /holidays/index.html {
    alias /opt/holidays/frontend/dist/index.html;
    add_header Cache-Control "no-cache";
}

location @holidays_spa {
    root /opt/holidays/frontend/dist;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}

location ^~ /holidays/api/ {
    proxy_pass http://127.0.0.1:8005/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
